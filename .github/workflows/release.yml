name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: kherin-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kherin/kherin

jobs:
  release:
    name: Publish and deploy exact image digest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Production
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Assert the validated commit is current main
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${VALIDATED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          read -r current_main current_ref extra \
            < <(git ls-remote --exit-code --refs origin refs/heads/main)
          [[ "${current_ref}" == refs/heads/main && -z "${extra:-}" ]]
          if [[ "${current_main}" != "${VALIDATED_SHA}" ]]; then
            printf 'Refusing stale release: validated=%s current-main=%s\n' \
              "${VALIDATED_SHA}" "${current_main}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Resolve an existing immutable commit image
        id: existing-image
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${VALIDATED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          image_tag="${IMAGE_NAME}:sha-${VALIDATED_SHA}"
          if digest_json=$(docker buildx imagetools inspect "${image_tag}" \
            --format '{{json .Manifest.Digest}}' 2>&1); then
            digest=$(jq -er \
              'select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' \
              <<<"${digest_json}") || {
              printf 'The existing commit tag returned an invalid manifest digest.\n' >&2
              exit 1
            }
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            gh attestation verify "oci://${IMAGE_NAME}@${digest}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref refs/heads/main \
              --source-digest "${VALIDATED_SHA}"
            printf 'digest=%s\n' "${digest}" >>"${GITHUB_OUTPUT}"
            printf 'exists=true\n' >>"${GITHUB_OUTPUT}"
            printf 'Reusing immutable commit image %s@%s.\n' "${IMAGE_NAME}" "${digest}"
          else
            if grep -Eiq '(^|[^0-9])404([^0-9]|$)|manifest unknown|not found' \
              <<<"${digest_json}"; then
              printf 'exists=false\n' >>"${GITHUB_OUTPUT}"
              printf 'No image exists for %s; a new immutable image will be built.\n' \
                "${VALIDATED_SHA}"
            else
              printf 'Failed to resolve the immutable commit image; refusing to build over an ambiguous tag state.\n' >&2
              exit 1
            fi
          fi

      - name: Build and publish immutable image
        if: steps.existing-image.outputs.exists == 'false'
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            PUBLIC_KEYSTATIC_GITHUB_APP_SLUG=${{ vars.PUBLIC_KEYSTATIC_GITHUB_APP_SLUG }}
          context: .
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          outputs: type=registry,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
          platforms: linux/amd64
          provenance: false

      - name: Attest image provenance
        if: steps.existing-image.outputs.exists == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Publish the immutable commit tag
        if: steps.existing-image.outputs.exists == 'false'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'The build did not produce a valid canonical digest.\n' >&2
            exit 1
          fi
          [[ "${VALIDATED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          image_tag="${IMAGE_NAME}:sha-${VALIDATED_SHA}"
          if docker buildx imagetools inspect "${image_tag}" >/dev/null 2>&1; then
            printf 'The immutable commit tag appeared during the build; refusing to move it.\n' >&2
            exit 1
          fi
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${image_tag}" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"
          published_digest=$(docker buildx imagetools inspect "${image_tag}" \
            --format '{{json .Manifest.Digest}}' \
            | jq -er 'select(type == "string" and test("^sha256:[0-9a-f]{64}$"))')
          [[ "${published_digest}" == "${IMAGE_DIGEST}" ]]

      - name: Verify digest and provenance
        id: release-image
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing-image.outputs.digest }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_DIGEST=${EXISTING_DIGEST:-${BUILT_DIGEST:-}}
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'No valid release image digest was selected.\n' >&2
            exit 1
          fi
          gh attestation verify "oci://${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --source-ref refs/heads/main \
            --source-digest "${VALIDATED_SHA}"
          printf 'digest=%s\n' "${IMAGE_DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: Recheck current main before deployment
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${VALIDATED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          read -r current_main current_ref extra \
            < <(git ls-remote --exit-code --refs origin refs/heads/main)
          [[ "${current_ref}" == refs/heads/main && -z "${extra:-}" ]]
          if [[ "${current_main}" != "${VALIDATED_SHA}" ]]; then
            printf 'Refusing superseded release: validated=%s current-main=%s\n' \
              "${VALIDATED_SHA}" "${current_main}" >&2
            exit 1
          fi

      - name: Join the deployment tailnet with GitHub OIDC
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-kherin
          ping: ${{ vars.TS_DEPLOY_HOST }}

      - name: Deploy the exact digest
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_DIGEST: ${{ steps.release-image.outputs.digest }}
          TS_DEPLOY_HOST: ${{ vars.TS_DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'No valid release image digest was verified.\n' >&2
            exit 1
          fi
          test -n "${TS_DEPLOY_HOST}"
          printf '%s\n%s\n' "${GHCR_USERNAME}" "${GHCR_TOKEN}" \
            | tailscale ssh "deploy-kherin@${TS_DEPLOY_HOST}" "deploy ${IMAGE_DIGEST}"
